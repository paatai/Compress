name: Release CLI binaries

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release -p kolmo-cli --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir dist
          tar -C target/${{ matrix.target }}/release -czf dist/kolmo-${{ matrix.target }}.tar.gz kolmo
      - uses: actions/upload-artifact@v4
        with:
          name: kolmo-${{ matrix.target }}
          path: dist/*.tar.gz
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
